name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Create app bundle
        run: |
          APP_NAME="ModelChange"
          BUNDLE_DIR="${APP_NAME}.app"
          mkdir -p "${BUNDLE_DIR}/Contents/MacOS"
          cp target/release/claude-model-proxy "${BUNDLE_DIR}/Contents/MacOS/${APP_NAME}"
          chmod +x "${BUNDLE_DIR}/Contents/MacOS/${APP_NAME}"
          
          cat > "${BUNDLE_DIR}/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>ModelChange</string>
            <key>CFBundleDisplayName</key>
            <string>ModelChange</string>
            <key>CFBundleIdentifier</key>
            <string>com.modelchange.app</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleExecutable</key>
            <string>ModelChange</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>LSUIElement</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Add app icon
        run: |
          APP_NAME="ModelChange"
          BUNDLE_DIR="${APP_NAME}.app"
          ICONSET="AppIcon.iconset"
          mkdir -p "${BUNDLE_DIR}/Contents/Resources"
          mkdir -p "${ICONSET}"

          if [ -f "assets/icon.png" ]; then
            ICON_SRC="assets/icon.png"
          elif [ -f "icon.png" ]; then
            ICON_SRC="icon.png"
          else
            echo "No icon.png found, skipping icon."
            exit 0
          fi

          sips -z 16 16     "${ICON_SRC}" --out "${ICONSET}/icon_16x16.png"
          sips -z 32 32     "${ICON_SRC}" --out "${ICONSET}/icon_16x16@2x.png"
          sips -z 32 32     "${ICON_SRC}" --out "${ICONSET}/icon_32x32.png"
          sips -z 64 64     "${ICON_SRC}" --out "${ICONSET}/icon_32x32@2x.png"
          sips -z 128 128   "${ICON_SRC}" --out "${ICONSET}/icon_128x128.png"
          sips -z 256 256   "${ICON_SRC}" --out "${ICONSET}/icon_128x128@2x.png"
          sips -z 256 256   "${ICON_SRC}" --out "${ICONSET}/icon_256x256.png"
          sips -z 512 512   "${ICON_SRC}" --out "${ICONSET}/icon_256x256@2x.png"
          sips -z 512 512   "${ICON_SRC}" --out "${ICONSET}/icon_512x512.png"
          sips -z 1024 1024 "${ICON_SRC}" --out "${ICONSET}/icon_512x512@2x.png"
          iconutil -c icns "${ICONSET}" -o "${BUNDLE_DIR}/Contents/Resources/AppIcon.icns"
          rm -rf "${ICONSET}"

      - name: Create ZIP
        run: zip -r ModelChange-macOS.zip ModelChange.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModelChange-macOS
          path: ModelChange-macOS.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ModelChange ${{ github.event.inputs.version || github.ref_name }}
          files: ModelChange-macOS.zip
          generate_release_notes: true
